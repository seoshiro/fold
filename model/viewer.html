<!doctype html><html><head><meta charset="UTF-8"><title>FOLD model proof</title><style>html,body{margin:0;height:100%;background:radial-gradient(ellipse at 45% 45%,#be2b18,#9c170d 70%)}canvas{width:100%;height:100%;display:block}#labels{position:fixed;inset:0;pointer-events:none;font:italic 20px Georgia;color:#392a1c}#labels span{position:absolute;transform:translate(-50%,-50%)}</style></head><body><canvas></canvas><div id="labels"></div><script type="module">import{FoldScene}from'/src/scene.ts';const el=document.querySelector('#labels');const scene=new FoldScene(document.querySelector('canvas'),{onReady:()=>{const city=new URLSearchParams(location.search).get('city');scene.setTarget({city,place:null,reducedMotion:true})},onError:console.error,onAnchors:a=>{el.innerHTML=a.filter(x=>x.visible).map(x=>`<span style="left:${x.x}px;top:${x.y}px">${x.id.replace('city-','').toUpperCase()}</span>`).join('')}});window.addEventListener('resize',()=>scene.resize());</script></body></html>
